<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빈집 서울 — 서울시 빈집 아카이브</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="서울시 25개 자치구의 빈집 분포 현황과 등급별 데이터 분석을 제공하는 디지털 아카이브 공간입니다.">
    <meta name="keywords" content="도시의 빈칸, 빈집 서울, 서울시 빈집, 데이터 시각화, 자치구별 빈집, 빈집 정비 사업">
    <meta property="og:title" content="빈집 서울 — 서울시 빈집 아카이브">
    <meta property="og:description" content="서울시 25개 자치구의 빈집 분포 현황과 등급별 데이터 분석을 제공합니다.">
    <meta property="og:type" content="website">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Chart.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

    <style>
        /* ----------------------------------------------------
           DESIGN SYSTEM & VARIABLES (Consistent with main site)
           ---------------------------------------------------- */
        :root {
            --bg: #F5F5F3;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-opaque: #ffffff;
            --text: #141412;
            --muted: #6C6C68;
            --border: rgba(20, 20, 18, 0.08);
            --border-hover: rgba(20, 20, 18, 0.15);
            --lime: #DFFE3D;
            --lime-dark: #C5E22B;
            --lime-light: rgba(223, 254, 61, 0.15);
            --c-red: #E84A49;
            --c-red-light: rgba(232, 74, 73, 0.1);
            --c-amber: #F09E2B;
            --c-amber-light: rgba(240, 158, 43, 0.1);
            --c-blue: #3E8EDE;
            --c-blue-light: rgba(62, 142, 222, 0.1);
            --c-green: #209F76;
            --c-green-light: rgba(32, 159, 118, 0.1);
            --c-purple: #4D45E8;
            --c-purple-light: rgba(77, 69, 232, 0.1);
            --font-mono: 'DM Mono', monospace;
            --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            --font-display: 'Plus Jakarta Sans', var(--font-sans);
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.06);
            --radius-sm: 8px;
            --radius-md: 16px;
            --lime-hover: #d2f02b;
            --lime-shadow: rgba(223, 254, 61, 0.3);
        }

        /* ----------------------------------------------------
           BASE STYLES
           ---------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.5;
            padding-bottom: 100px;
        }

        /* Grid Background Pattern Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -2;
            opacity: 0.5;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }

        /* ----------------------------------------------------
           NAVIGATION (GNB)
           ---------------------------------------------------- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 74px;
            padding: 0 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(248, 248, 245, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-sizing: border-box;
        }

        .logo {
            font-family: var(--font-sans);
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-opaque);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }

        .logo::before {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--lime);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--lime);
            transition: var(--transition-smooth);
        }

        .logo:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--border-hover);
        }

        .logo:hover::before {
            transform: scale(1.3);
            background: var(--text);
            box-shadow: 0 0 12px var(--text);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 8px;
            background: var(--surface);
            padding: 6px;
            border-radius: 40px;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        nav ul li a {
            text-decoration: none;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 22px;
            border-radius: 30px;
            transition: var(--transition-smooth);
            display: inline-block;
        }

        nav ul li a:hover {
            color: var(--text);
            background: rgba(0, 0, 0, 0.03);
        }

        /* ----------------------------------------------------
           CONTAINER & LAYOUT
           ---------------------------------------------------- */
        .container {
            max-width: 1200px;
            margin: 120px auto 0;
            padding: 0 24px;
        }

        .back-nav {
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 700;
            background: var(--surface-opaque);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }

        .back-btn:hover {
            transform: translateX(-4px);
            background: var(--lime);
            border-color: transparent;
            box-shadow: 0 5px 15px var(--lime-shadow);
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 45px;
            margin-bottom: 40px;
        }

        .hero-spacer {
            width: 110px;
            flex-shrink: 0;
        }

        .hero-text {
            flex: 1;
            text-align: center;
        }

        .hero-qr-container {
            width: 110px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .hero-tag {
            font-size: 0.72rem;
            font-family: var(--font-mono);
            font-weight: 500;
            background: var(--surface-opaque);
            color: var(--text);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .hero-tag::before {
            content: '✦';
            color: var(--c-purple);
            font-weight: bold;
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: 2.6rem;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.04em;
            color: var(--text);
            margin-bottom: 16px;
            text-align: center;
        }

        .hero-title span {
            color: var(--muted);
            font-weight: 300;
        }

        .hero-title::after {
            content: '.';
            color: var(--lime);
            display: inline-block;
        }

        .hero-desc {
            font-size: 0.95rem;
            color: var(--muted);
            max-width: 720px;
            line-height: 1.7;
            font-weight: 400;
            margin: 0 auto;
            text-align: center;
        }

        /* ----------------------------------------------------
           METRICS CARD ROW
           ---------------------------------------------------- */
        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .m-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .m-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .m-card.acc {
            background: var(--lime);
            border-color: transparent;
            box-shadow: 0 10px 25px var(--lime-shadow);
        }

        .m-card.acc:hover {
            background: var(--lime-hover);
            box-shadow: 0 14px 30px var(--lime-shadow);
        }

        .m-card .lbl {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .m-card.acc .lbl {
            color: rgba(20, 20, 18, 0.6);
        }

        .m-card .val {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
            line-height: 1.1;
        }

        .m-card .sb {
            font-size: 0.7rem;
            font-family: var(--font-mono);
            color: var(--muted);
            margin-top: 10px;
        }

        .m-card.acc .sb {
            color: rgba(20, 20, 18, 0.7);
        }

        /* ----------------------------------------------------
           DASHBOARD & CHARTS
           ---------------------------------------------------- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .panel {
            background: var(--surface-opaque);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 28px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
        }

        .panel:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border-hover);
        }

        .p-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .p-sub {
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 24px;
            font-family: var(--font-mono);
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 320px;
        }

        .side-charts {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .side-charts .chart-container {
            height: 220px;
        }

        /* ----------------------------------------------------
           DATA TABLES
           ---------------------------------------------------- */
        .table-panel {
            margin-bottom: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            text-align: left;
        }

        thead tr {
            border-bottom: 2px solid var(--text);
        }

        th {
            padding: 12px 14px;
            font-weight: 700;
            color: var(--text);
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        td {
            padding: 14px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-weight: 500;
        }

        tbody tr {
            transition: var(--transition-smooth);
        }

        tbody tr:hover {
            background: rgba(0, 0, 0, 0.01);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            font-size: 0.65rem;
            font-family: var(--font-mono);
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.red {
            background: var(--c-red-light);
            color: var(--c-red);
            border: 1px solid rgba(232, 74, 73, 0.2);
        }

        .badge.blue {
            background: var(--c-blue-light);
            color: var(--c-blue);
            border: 1px solid rgba(62, 142, 222, 0.2);
        }

        .badge.green {
            background: var(--c-green-light);
            color: var(--c-green);
            border: 1px solid rgba(32, 159, 118, 0.2);
        }

        .badge.amber {
            background: var(--c-amber-light);
            color: var(--c-amber);
            border: 1px solid rgba(240, 158, 43, 0.2);
        }

        /* ----------------------------------------------------
           PROJECT RENEWAL GALLERY
           ---------------------------------------------------- */
        .gallery-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gallery-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 1.1em;
            background: var(--text);
            border-radius: 3px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .project-card {
            background: var(--surface-opaque);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 280px;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .project-meta {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .proj-tag {
            font-size: 0.68rem;
            font-family: var(--font-mono);
            color: var(--muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .proj-title {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.3;
            color: var(--text);
        }

        .proj-desc {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .proj-footer {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .proj-location {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
        }

        /* ----------------------------------------------------
           RESPONSIVE MEDIA QUERIES
           ---------------------------------------------------- */
        @media (max-width: 900px) {
            header {
                padding: 0 24px;
                height: 56px;
            }

            .container {
                margin-top: 90px;
                padding: 0 16px;
            }

            .hero {
                flex-direction: column;
                gap: 24px;
            }

            .hero-spacer {
                display: none;
            }

            .hero-title {
                font-size: 2rem;
            }

            .metrics {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Floating GNB -->
    <header>
        <div class="logo" id="main-logo" onclick="window.location.href='index.html'" aria-label="도시의 빈칸 메인페이지로 이동">도시의 빈칸</div>
        <nav>
            <ul>
                <li><a href="index.html" class="n-lnk">Home</a></li>
                <li><a href="index.html#archive" class="n-lnk">Archive</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        
        <!-- Back Navigation -->
        <div class="back-nav">
            <a href="index.html" class="back-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>

            </a>
        </div>

        <!-- Hero Section -->
        <section class="hero">

            </div>
            <div class="hero-qr-container">
                <img src="home_image/이가연_qr.jpg" alt="이가연 QR" style="width: 110px; height: 110px; border: 1px solid var(--border); box-shadow: var(--shadow-md); transition: var(--transition-smooth); cursor: pointer;" onclick="window.open('home_image/이가연_qr.jpg', '_blank')" onmouseover="this.style.transform='scale(1.08) translateY(-4px) rotate(1deg)'; this.style.boxShadow='var(--shadow-lg)';" onmouseout="this.style.transform='scale(1) translateY(0) rotate(0)'; this.style.boxShadow='var(--shadow-md)';" title="QR 코드 크게 보기">
                <span style="font-size: 0.7rem; font-family: var(--font-mono); color: var(--muted); letter-spacing: 0.05em;">WEBSITE LINK QR</span>
            </div>
        </section>

        <!-- Link to Original Website -->
        <div style="display: flex; justify-content: center; margin-top: 30px; margin-bottom: 20px;">
            <a href="https://www.figma.com/proto/bTmI2T108PSvDQhsUdYElR/%EB%8D%B0%EC%8B%9C%EC%A0%95_%EA%B0%9C%EC%9D%B8?node-id=76-251&t=xvKoKYEa59EDQuw5-1" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); font-size: 0.95rem; font-weight: 700; background: var(--lime); border: 1px solid transparent; padding: 14px 28px; border-radius: 30px; box-shadow: 0 10px 25px var(--lime-shadow); transition: var(--transition-smooth);" onmouseover="this.style.background='var(--lime-hover)'; this.style.transform='translateY(-3px)'; this.style.boxShadow='0 14px 30px var(--lime-shadow)';" onmouseout="this.style.background='var(--lime)'; this.style.transform='translateY(0)'; this.style.boxShadow='0 10px 25px var(--lime-shadow)';" title="Figma 웹사이트로 바로가기">
                웹사이트 바로가기
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
            </a>
        </div>

        <!-- Project Detail Image Section -->
        <section class="detail-image-sec" style="display: flex; justify-content: center; align-items: center; margin-top: 20px; margin-bottom: 60px;">
            <div style="width: 100%; max-width: 1000px; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm); background: var(--surface-opaque); padding: 16px; transition: var(--transition-smooth);" onmouseover="this.style.transform='translateY(-6px)'; this.style.boxShadow='var(--shadow-lg)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='var(--shadow-sm)';">
                <img src="home_image/이가연_상세.png" alt="빈집 서울 상세 이미지" style="width: 100%; height: auto; display: block; border-radius: var(--radius-sm);">
            </div>
        </section>

    </div>
</body>
